<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c5c5c5"><title>Sowers Field Paint</title><link rel="stylesheet" href="./style.css"></head><body><main class="app">
<header class="titlebar"><a class="brand" href="/sowers/">SOWERS</a><span>Field Paint</span><span id="doc-title">Untitled — 640 × 480 px</span><button id="help" title="Keyboard shortcuts">Help</button></header>
<nav class="menubar"><button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="image">Image</button><button data-menu="view">View</button><button data-menu="memorial">Memorial</button><div id="menu-pop"></div></nav>
<div class="toolbar"><div class="toolgrid" role="toolbar" aria-label="Paint tools">
<button class="tool active" data-tool="select" title="Rectangular selection (M)">▧<small>Select</small></button><button class="tool" data-tool="lasso" title="Free-form selection">⌁<small>Lasso</small></button><button class="tool" data-tool="pencil" title="Pencil (P)">✎<small>Pencil</small></button><button class="tool" data-tool="brush" title="Brush (B)">🖌<small>Brush</small></button><button class="tool" data-tool="airbrush" title="Airbrush (A)">▦<small>Airbrush</small></button><button class="tool" data-tool="magnifier" title="Magnifier (Z)">⌕<small>Zoom</small></button>
<button class="tool" data-tool="eraser" title="Eraser (E)">▰<small>Eraser</small></button><button class="tool" data-tool="fill" title="Fill (F)">▱<small>Fill</small></button><button class="tool" data-tool="eyedropper" title="Color picker (I)">⌕<small>Picker</small></button><button class="tool" data-tool="text" title="Text (T)">T<small>Text</small></button>
<button class="tool" data-tool="line" title="Line (L)">╱<small>Line</small></button><button class="tool" data-tool="curve" title="Curve (C)">⌒<small>Curve</small></button><button class="tool" data-tool="rect" title="Rectangle (R)">□<small>Rect</small></button><button class="tool" data-tool="roundrect" title="Rounded rectangle">▢<small>Round</small></button><button class="tool" data-tool="ellipse" title="Ellipse (O)">○<small>Ellipse</small></button><button class="tool" data-tool="polygon" title="Polygon (G)">⬡<small>Polygon</small></button></div>
<div class="options"><strong>Tool options</strong><label>Size <select id="size"><option value="1">1 px</option><option value="2">2 px</option><option value="4" selected>4 px</option><option value="8">8 px</option><option value="16">16 px</option></select></label><label>Shape <select id="shape-mode"><option value="outline">Outline</option><option value="fill">Filled</option><option value="both">Outline + fill</option></select></label><label>Fill <select id="fill-mode"><option value="solid">Solid</option><option value="none">Transparent</option></select></label><label><input type="checkbox" id="opaque-select" checked> Opaque selection</label><label>Zoom <select id="zoom"><option>25</option><option>50</option><option selected>100</option><option>150</option><option>200</option><option>400</option></select>%</label><label><input type="checkbox" id="grid"> Pixel grid</label><label>Background <button id="bg-color" class="mini-color"></button></label></div></div>
<section class="palettebar"><div class="swatches" id="swatches"></div><div class="current-colors"><button id="swap" title="Swap foreground and background (X)">⇄</button><label>FG <input id="fg" type="color" value="#000000"></label><label>BG <input id="bg" type="color" value="#ffffff"></label></div></section>
<div class="workspace"><aside class="side"><strong>Canvas</strong><span id="dimensions">640 × 480</span><button id="resize">Resize…</button><button id="clear">Clear</button><hr><strong>Image</strong><button data-action="flip-h">Flip horizontal</button><button data-action="flip-v">Flip vertical</button><button data-action="rotate-left">Rotate left</button><button data-action="rotate-right">Rotate right</button><button data-action="invert">Invert colors</button><button data-action="stretch">Stretch / skew…</button><button data-action="print">Print…</button><hr><strong>Selection</strong><button id="crop">Crop to selection</button><button id="copy">Copy</button><button id="cut">Cut</button><button id="paste">Paste</button><button id="select-all">Select all</button><button id="deselect">Deselect</button><div id="text-entry" hidden><label>Type text<textarea id="text-value" rows="3"></textarea></label><label>Font <select id="font"><option>Arial</option><option>Georgia</option><option>Courier New</option><option>Verdana</option></select></label><label>Size <input type="number" id="font-size" value="24" min="6" max="144"></label><button id="place-text">Place text</button></div></aside>
<section class="canvas-area" id="canvas-area"><div class="canvas-wrap" id="canvas-wrap"><canvas id="paint" width="640" height="480" aria-label="Drawing canvas"></canvas><canvas id="overlay" width="640" height="480" aria-hidden="true"></canvas></div></section></div>
<footer><span id="status">Ready · Draw with pointer or touch</span><span id="coords">0, 0 px</span><span id="history-label">Undo history: 1</span></footer>
<input hidden id="file-open" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/json,.json"><input hidden id="paste-file" type="file" accept="image/*">
</main><dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><menu><button value="cancel">Cancel</button><button value="ok" class="primary">OK</button></menu></form></dialog><script type="module" src="./main.js"></script></body></html>
