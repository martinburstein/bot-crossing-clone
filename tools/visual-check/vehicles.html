<!doctype html><html><head><meta charset="utf-8"><title>Mars fleet geometry inspection</title><style>body{margin:0;background:#d6e0e4;color:#233441;font:13px system-ui}header{padding:12px 20px;display:flex;gap:16px;align-items:center}button{padding:8px}main{display:grid;grid-template-columns:repeat(4,1fr)}article{border:1px solid #b1bec5;position:relative;height:245px}h3{position:absolute;left:12px;top:0;font-size:13px}canvas{width:100%;height:100%;display:block}</style></head><body><header><b>Mars fleet · geometry inspection</b><button id="front">Front quarter</button><button id="rear">Rear quarter</button><button id="side">Side</button><button id="top">Top</button><button id="motion">Motion: stopped</button></header><main></main><script type="module">
import * as THREE from 'three';import {loadCrew,crewRig} from '../../src/agents/crew.js';import {Settings} from '../../src/core/settings.js';import {createPilotPreview} from '../../src/agents/pilot-preview.js';import {VEHICLES,createVehicle} from '../../src/world/mars-vehicles.js'
await loadCrew();const settings=new Settings();settings.transient=true;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(500,300);renderer.setClearColor(0xd6e0e4);renderer.toneMapping=THREE.ACESFilmicToneMapping
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x687b91,3));const sun=new THREE.DirectionalLight(0xffefdb,4);sun.position.set(4,6,5);scene.add(sun)
const camera=new THREE.PerspectiveCamera(34,500/300,.05,100),models=[],views={front:[4,3,5],rear:[-4,3,-5],side:[6,1,0],top:[0,7,.01]};let view='front',motion=false
for(const v of VEHICLES){const card=document.createElement('article');card.innerHTML=`<h3>${v.name}</h3>`;const canvas=document.createElement('canvas');canvas.width=500;canvas.height=300;card.append(canvas);document.querySelector('main').append(card);const pilot=createPilotPreview(scene,settings,crewRig());pilot.group.visible=false;models.push({model:createVehicle(v.id,{merge:false}),canvas,pilot,card})}
for(const name of Object.keys(views))document.getElementById(name).onclick=()=>view=name
document.getElementById('motion').onclick=e=>{motion=!motion;e.target.textContent=`Motion: ${motion?'running':'stopped'}`}
function checkFit(model,pilot){
 const results=[]
 for(const time of [0,.75,1.5,2.25]){
  pilot.update(time,model.userData.seat);model.userData.animate(time,true);model.updateMatrixWorld(true)
  const points=pilot.points(),hits=[]
  for(const part of model.userData.parts){
   const inv=part.matrixWorld.clone().invert(),b=part.userData.block,p=part.geometry.parameters
   let count=0
   for(const point of points){const q=point.clone().applyMatrix4(inv)
    if(model.userData.canopies.includes(part)){if(q.y>0&&q.lengthSq()>1.001)count++}
    else if(b){if(Math.abs(q.x)<b.w/2-.002&&Math.abs(q.y)<b.h/2-.002&&Math.abs(q.z)<b.d/2-.002)count++}
    else if(part.geometry.type==='CylinderGeometry'){if(Math.abs(q.y)<p.height/2-.002&&q.x*q.x+q.z*q.z<(p.radiusTop-.002)**2)count++}
   }
   if(count)hits.push({part:part.name,type:part.geometry.type,count})
  }
  results.push({time,hits})
 }
 return results
}
function render(time){for(const {model,canvas,pilot,card} of models){pilot.group.visible=true;if(!card.dataset.fit){card.dataset.fit=JSON.stringify(checkFit(model,pilot));const bounds=new THREE.Box3().setFromPoints(pilot.points().map(p=>p.sub(model.userData.seat)));card.dataset.bounds=JSON.stringify({min:bounds.min.toArray(),max:bounds.max.toArray(),seat:model.userData.seat.toArray()});}pilot.update(motion?time/1000:0,model.userData.seat);scene.add(model);model.userData.animate(time/1000,motion);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());camera.position.copy(center).add(new THREE.Vector3(...views[view]).normalize().multiplyScalar(Math.max(size.x,size.y,size.z)*2));camera.lookAt(center);renderer.render(scene,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);scene.remove(model);pilot.group.visible=false}setTimeout(()=>requestAnimationFrame(render),200)}render(0)
</script></body></html>
